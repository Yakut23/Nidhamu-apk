<!DOCTYPE html>
<html lang="sw" data-theme="light" data-lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0F172A" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>Corevia — Jukwaa la Usimamizi wa Shirika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="libs/pdf.min.js" defer></script>
<style>
/* ============================================================
   COREVIA THEME SYSTEM
   ============================================================ */
:root {
  --brand-primary: #2563EB;
  --brand-secondary: #1E40AF;
  --brand-accent: #F59E0B;
  --brand-banner: linear-gradient(135deg,#2563EB 0%,#1E40AF 100%);

  --bg-app: #F5F7FB;
  --bg-surface: #FFFFFF;
  --bg-elevated: #FFFFFF;
  --bg-muted: #EEF2F7;
  --bg-overlay: rgba(15,23,42,.55);

  --text-primary: #0F172A;
  --text-secondary: #475569;
  --text-muted: #94A3B8;
  --text-inverse: #FFFFFF;

  --border-subtle: #E2E8F0;
  --border-strong: #CBD5E1;

  --state-success: #16A34A;
  --state-warning: #F59E0B;
  --state-danger: #DC2626;
  --state-info: #0EA5E9;
  --state-neutral: #64748B;

  --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
  --shadow-md: 0 4px 12px rgba(15,23,42,.08);
  --shadow-lg: 0 12px 28px rgba(15,23,42,.12);

  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;

  --space-1: 4px; --space-2: 8px; --space-3: 12px;
  --space-4: 16px; --space-5: 20px; --space-6: 24px;
  --space-7: 32px; --space-8: 40px;

  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-xs: 11px; --font-sm: 13px; --font-md: 15px;
  --font-lg: 17px; --font-xl: 20px; --font-2xl: 24px;
  --font-3xl: 28px;

  --nav-height: 62px;
  --header-height: 60px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

[data-theme="dark"] {
  --bg-app: #0B1220;
  --bg-surface: #111A2E;
  --bg-elevated: #172036;
  --bg-muted: #1B2740;
  --bg-overlay: rgba(0,0,0,.65);

  --text-primary: #F1F5F9;
  --text-secondary: #B6C2D4;
  --text-muted: #7A88A0;
  --text-inverse: #0F172A;

  --border-subtle: #223052;
  --border-strong: #33456E;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  --shadow-md: 0 4px 14px rgba(0,0,0,.45);
  --shadow-lg: 0 14px 32px rgba(0,0,0,.55);
}

*,*::before,*::after { box-sizing: border-box; }
html,body { margin:0; padding:0; height:100%; }
body {
  font-family: var(--font-family);
  background: var(--bg-app);
  color: var(--text-primary);
  font-size: var(--font-md);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: var(--font-md); color: inherit; }
a { color: inherit; text-decoration: none; }
ul, ol { margin: 0; padding: 0; list-style: none; }
::-webkit-scrollbar { width: 0; height: 0; }
:focus-visible { outline: 2px solid var(--brand-primary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ============================================================
   APP SHELL
   ============================================================ */
#app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

.app-header {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  padding-top: var(--safe-top);
}
.app-header-inner {
  height: var(--header-height);
  display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-4);
}
.app-header .brand {
  display: flex; align-items: center; gap: var(--space-3); min-width: 0; flex: 1;
}
.app-header .brand-logo {
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  background: var(--brand-banner);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 18px; flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.app-header .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
.app-header .brand-text { min-width: 0; }
.app-header .brand-title {
  font-size: var(--font-md); font-weight: 700; line-height: 1.1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.app-header .brand-sub {
  font-size: var(--font-xs); color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  width: 42px; height: 42px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); position: relative; flex-shrink: 0;
  transition: background .15s;
}
.icon-btn:active { background: var(--bg-muted); }
.icon-btn .badge {
  position: absolute; top: 6px; right: 6px;
  min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: var(--radius-pill);
  background: var(--state-danger); color: #fff;
  font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn svg { width: 22px; height: 22px; }

.app-main {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: var(--space-4);
  padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + var(--space-6));
  -webkit-overflow-scrolling: touch;
}
.view { animation: fadeIn .18s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity:1; transform:none; } }

.app-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  height: calc(var(--nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  display: flex; align-items: stretch;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  color: var(--text-muted); font-size: var(--font-xs); font-weight: 600;
  transition: color .15s;
}
.nav-item svg { width: 22px; height: 22px; }
.nav-item.active { color: var(--brand-primary); }
.nav-item:active { background: var(--bg-muted); }

.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--space-3);
}
.card-elevated { box-shadow: var(--shadow-md); }
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-3);
}
.card-title { font-size: var(--font-md); font-weight: 700; }
.card-sub { font-size: var(--font-xs); color: var(--text-muted); margin-top: 2px; }
.section-title {
  font-size: var(--font-lg); font-weight: 700;
  margin: var(--space-4) 0 var(--space-3);
  display: flex; align-items: center; justify-content: space-between;
}
.section-title .link { font-size: var(--font-sm); color: var(--brand-primary); font-weight: 600; }

.hero {
  background: var(--brand-banner);
  color: #fff;
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  margin-bottom: var(--space-4);
  box-shadow: var(--shadow-md);
}
.hero h1 { margin: 0; font-size: var(--font-2xl); font-weight: 800; }
.hero p { margin: var(--space-1) 0 0; opacity: .9; font-size: var(--font-sm); }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}
.stat-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-4);
  box-shadow: var(--shadow-sm);
}
.stat-value { font-size: var(--font-2xl); font-weight: 800; color: var(--brand-primary); line-height: 1; }
.stat-label { font-size: var(--font-xs); color: var(--text-muted); margin-top: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

.quick-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-2);
  margin-bottom: var(--space-4);
}
.quick-action {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-2);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-align: center; font-size: var(--font-xs); font-weight: 600;
  color: var(--text-secondary);
  transition: transform .12s, background .12s;
}
.quick-action:active { transform: scale(.95); background: var(--bg-muted); }
.quick-action .qa-icon {
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  background: var(--bg-muted); color: var(--brand-primary);
  display: flex; align-items: center; justify-content: center;
}
.quick-action .qa-icon svg { width: 20px; height: 20px; }

.search-box { position: relative; margin-bottom: var(--space-4); }
.search-box input {
  width: 100%; padding: 12px 14px 12px 42px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  outline: none; transition: border-color .15s;
}
.search-box input:focus { border-color: var(--brand-primary); }
.search-box svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; color: var(--text-muted);
}

.list-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  margin-bottom: var(--space-2);
  transition: background .12s;
}
.list-item:active { background: var(--bg-muted); }
.list-item .avatar {
  width: 42px; height: 42px; border-radius: var(--radius-sm);
  background: var(--brand-banner); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; flex-shrink: 0; overflow: hidden;
}
.list-item .avatar img { width: 100%; height: 100%; object-fit: cover; }
.list-item .meta { flex: 1; min-width: 0; }
.list-item .meta .title { font-weight: 600; font-size: var(--font-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .meta .sub { font-size: var(--font-xs); color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.list-item .chev { color: var(--text-muted); flex-shrink: 0; }
.list-item .chev svg { width: 18px; height: 18px; }

.badge-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: var(--radius-pill);
  font-size: var(--font-xs); font-weight: 700;
  background: var(--bg-muted); color: var(--text-secondary);
}
.badge-pill.success { background: rgba(22,163,74,.14); color: var(--state-success); }
.badge-pill.warning { background: rgba(245,158,11,.16); color: #B45309; }
.badge-pill.danger  { background: rgba(220,38,38,.14); color: var(--state-danger); }
.badge-pill.info    { background: rgba(14,165,233,.14); color: #0369A1; }
.badge-pill.primary { background: rgba(37,99,235,.12); color: var(--brand-primary); }
.badge-pill.muted   { background: var(--bg-muted); color: var(--text-muted); }

.chip-row { display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: 4px; margin-bottom: var(--space-3); }
.chip {
  padding: 6px 12px; border-radius: var(--radius-pill);
  background: var(--bg-muted); color: var(--text-secondary);
  font-size: var(--font-xs); font-weight: 600; white-space: nowrap;
  border: 1px solid transparent;
}
.chip.active { background: var(--brand-primary); color: #fff; }

.progress {
  height: 8px; background: var(--bg-muted);
  border-radius: var(--radius-pill); overflow: hidden;
  margin-top: var(--space-2);
}
.progress > i {
  display: block; height: 100%; background: var(--brand-primary);
  border-radius: var(--radius-pill); transition: width .4s ease;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px; border-radius: var(--radius-sm);
  font-size: var(--font-sm); font-weight: 700;
  transition: transform .1s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--brand-primary); color: #fff; }
.btn-secondary { background: var(--bg-muted); color: var(--text-primary); }
.btn-ghost { background: transparent; color: var(--brand-primary); }
.btn-danger { background: var(--state-danger); color: #fff; }
.btn-block { width: 100%; }
.btn svg { width: 16px; height: 16px; }
.btn-sm { padding: 6px 12px; font-size: var(--font-xs); }
.btn-xs { padding: 3px 8px; font-size: 11px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--space-3); }
.form-label { display: block; font-size: var(--font-sm); font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.form-label .req { color: var(--state-danger); margin-left: 2px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border-subtle);
  background: var(--bg-surface); outline: none;
  font-size: var(--font-md);
  transition: border-color .15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--brand-primary); }
.form-input.error, .form-select.error, .form-textarea.error { border-color: var(--state-danger); }
.form-error { font-size: var(--font-xs); color: var(--state-danger); margin-top: 4px; display: none; }
.form-error.show { display: block; }
.form-textarea { min-height: 88px; resize: vertical; }

.modal-overlay {
  position: fixed; inset: 0; background: var(--bg-overlay);
  z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-sheet {
  width: 100%; max-width: 640px;
  background: var(--bg-surface);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: var(--space-5);
  padding-bottom: calc(var(--space-5) + var(--safe-bottom));
  max-height: 90vh; overflow-y: auto;
  transform: translateY(100%); transition: transform .25s ease;
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-sheet.dragging { transition: none; }
.modal-overlay.dragging { transition: none; }
.modal-handle {
  width: 44px; height: 4px; border-radius: var(--radius-pill);
  background: var(--border-strong); margin: 0 auto var(--space-4);
  position: relative; touch-action: none; cursor: grab;
}
.modal-handle::before { /* eneo kubwa la kushika */
  content: ""; position: absolute; left: -40px; right: -40px; top: -16px; bottom: -16px;
}
.modal-title { font-size: var(--font-lg); font-weight: 700; margin-bottom: var(--space-4); }

.tabs {
  display: flex; gap: var(--space-1);
  background: var(--bg-muted);
  padding: 4px; border-radius: var(--radius-sm);
  margin-bottom: var(--space-4);
  overflow-x: auto;
}
.tab {
  flex: 1; padding: 8px 12px; border-radius: var(--radius-xs);
  font-size: var(--font-sm); font-weight: 600;
  color: var(--text-secondary); white-space: nowrap;
  transition: background .15s, color .15s;
}
.tab.active { background: var(--bg-surface); color: var(--brand-primary); box-shadow: var(--shadow-sm); }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-height) + var(--safe-bottom) + 16px);
  transform: translateX(-50%) translateY(20px);
  background: var(--text-primary); color: var(--text-inverse);
  padding: 11px 18px; border-radius: var(--radius-pill);
  font-size: var(--font-sm); font-weight: 600;
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
  max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty-state { text-align: center; padding: var(--space-7) var(--space-4); color: var(--text-muted); }
.empty-state svg { width: 56px; height: 56px; margin: 0 auto var(--space-3); opacity: .35; }
.empty-state h3 { margin: 0 0 var(--space-1); font-size: var(--font-md); color: var(--text-secondary); }
.empty-state p { margin: 0 0 var(--space-4); font-size: var(--font-sm); }

.skeleton {
  background: linear-gradient(90deg, var(--bg-muted) 25%, var(--border-subtle) 50%, var(--bg-muted) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.pdf-viewer {
  position: fixed; inset: 0; background: #1A1A1A;
  z-index: 300; display: none; flex-direction: column;
}
.pdf-viewer.open { display: flex; }
.pdf-toolbar {
  background: #111; color: #fff;
  padding: var(--space-3) var(--space-4);
  padding-top: calc(var(--space-3) + var(--safe-top));
  display: flex; align-items: center; gap: var(--space-3);
  border-bottom: 1px solid #333;
}
.pdf-toolbar .title { flex: 1; font-size: var(--font-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pdf-toolbar .icon-btn { color: #fff; }
.pdf-body { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: var(--space-4); }
.pdf-body iframe { background: #fff; border-radius: var(--radius-sm); max-width: 100%; }
.pdf-body canvas { background: #fff; border-radius: var(--radius-sm); max-width: none; flex-shrink: 0; margin: 0 auto; }
.pdf-placeholder {
  color: #ccc; text-align: center; padding: var(--space-7);
  display: flex; flex-direction: column; align-items: center; gap: var(--space-3);
}
.pdf-placeholder svg { width: 72px; height: 72px; opacity: .5; }
.pdf-pager {
  background: #111; color: #fff;
  padding: var(--space-2) var(--space-4);
  padding-bottom: calc(var(--space-2) + var(--safe-bottom));
  display: flex; align-items: center; justify-content: center; gap: var(--space-4);
  border-top: 1px solid #333; font-size: var(--font-sm);
}

.avatar-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: var(--space-3);
}
.avatar-card {
  text-align: center;
  padding: var(--space-3) var(--space-2);
  border-radius: var(--radius-md);
  background: var(--bg-surface); border: 1px solid var(--border-subtle);
  cursor: pointer;
}
.avatar-card .avatar {
  width: 52px; height: 52px; margin: 0 auto var(--space-2);
  border-radius: 50%; background: var(--brand-banner); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 18px; overflow: hidden;
}
.avatar-card .avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-card .name { font-size: var(--font-xs); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar-card .role { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.row { display: flex; align-items: center; gap: var(--space-3); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--text-muted); }
.text-sm { font-size: var(--font-sm); }
.text-xs { font-size: var(--font-xs); }
.mt-1 { margin-top: var(--space-1); }
.mt-2 { margin-top: var(--space-2); }
.mt-3 { margin-top: var(--space-3); }
.mt-4 { margin-top: var(--space-4); }
.mb-2 { margin-bottom: var(--space-2); }
.mb-3 { margin-bottom: var(--space-3); }
.py-2 { padding-top: var(--space-2); padding-bottom: var(--space-2); }
.hidden { display: none !important; }
.divider { height: 1px; background: var(--border-subtle); margin: var(--space-3) 0; }
.link { color: var(--brand-primary); cursor: pointer; text-decoration: underline; }

.toggle { position: relative; display: inline-block; width: 42px; height: 24px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle span { position: absolute; inset: 0; background: var(--border-subtle); border-radius: 24px; cursor: pointer; transition: .2s; }
.toggle span::before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .2s; }
.toggle input:checked + span { background: var(--brand-primary); }
.toggle input:checked + span::before { transform: translateX(18px); }

.back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 0; margin-bottom: 12px; background: none; border: none; color: var(--brand-primary); font-size: var(--font-sm); font-weight: 600; cursor: pointer; }
.back-btn svg { width: 16px; height: 16px; }

.swipe-card { touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; }
.swipe-hint { text-align: center; font-size: var(--font-xs, 12px); color: var(--text-muted, #888); margin: 4px 0 10px; }
.notif-unread { border-left: 3px solid var(--brand-primary); }
.notif-read { opacity: 0.65; }

/* Setup screen */
.setup-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: var(--space-5);
  background: var(--bg-app);
}
.setup-card {
  width: 100%;
  max-width: 520px;
  background: var(--bg-surface);
  border-radius: var(--radius-lg);
  padding: var(--space-6);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-subtle);
}
.setup-logo-preview {
  width: 80px; height: 80px; margin: 0 auto var(--space-4);
  border-radius: var(--radius-md);
  background: var(--brand-banner);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 32px;
  overflow: hidden;
  border: 2px dashed var(--border-strong);
  position: relative;
}
.setup-logo-preview img { width: 100%; height: 100%; object-fit: cover; }
.setup-logo-preview.has-logo { border-style: solid; border-color: transparent; }
.setup-title {
  text-align: center;
  font-size: var(--font-2xl);
  font-weight: 800;
  margin: 0 0 var(--space-2);
}
.setup-sub {
  text-align: center;
  color: var(--text-muted);
  font-size: var(--font-sm);
  margin: 0 0 var(--space-6);
}
.setup-color-row {
  display: flex; gap: var(--space-3); flex-wrap: wrap;
}
.setup-color-item {
  flex: 1; min-width: 100px;
}
.setup-preview {
  border-radius: var(--radius-md);
  padding: var(--space-4);
  color: #fff;
  margin-top: var(--space-4);
  margin-bottom: var(--space-4);

  display: flex;
  align-items: center;
  gap: var(--space-3);

.setup-preview-logo {

  flex-shrink: 0;

.setup-preview-logo img { width: 100%; height: 100%; object-fit: cover; }

@media (min-width: 720px) {
  .stats-grid { grid-template-columns: repeat(4, 1fr); }

/* ============================================================

:root {

body { font-size: 14px; letter-spacing: -.01em; }
.app-header {

.app-header .brand-title { font-size: 14px; font-weight: 800; letter-spacing: -.025em; }
.app-header .brand-sub { font-size: 10px; }
.icon-btn { width: 38px; height: 38px; border-radius: 11px; background: var(--bg-muted); }
.icon-btn:hover { background: color-mix(in srgb, var(--brand-primary) 9%, var(--bg-muted)); color: var(--brand-primary); }

.app-main {
  padding: 18px 16px calc(var(--nav-height) + var(--safe-bottom) + 28px);

.view { max-width: var(--ui-page-max); margin: 0 auto; }
.section-title { font-size: 15px; font-weight: 800; letter-spacing: -.025em; margin-top: 20px; }
.card {

.card:hover { transform: translateY(-1px); box-shadow: var(--ui-shadow-float); border-color: color-mix(in srgb, var(--brand-primary) 22%, var(--ui-line)); }
.card-header { margin-bottom: 12px; }
.card-title { font-size: 14px; font-weight: 800; }

.hero {

.stats-grid, .grid-2, .grid-3, .grid-4 { gap: 10px !important; }
.stat-card { border-radius: 15px !important; padding: 14px !important; }
.stat-value { font-size: 22px !important; font-weight: 850 !important; letter-spacing:-.04em; }
.stat-label { font-size: 10px !important; text-transform: uppercase; letter-spacing:.05em; font-weight:700; }

.badge-pill, .chip { border-radius: 999px !important; font-size: 10px !important; font-weight: 750 !important; }

.tabs {

.tabs::-webkit-scrollbar { display:none; }
.tab { flex:0 0 auto; border-radius:10px !important; padding:8px 12px !important; font-size:11px !important; font-weight:750 !important; color:var(--text-secondary); }

.app-nav {

.modal-backdrop { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

/* ============================================================
   COREVia — IMPORTANT GOALS CHART
   Replaces stacked goal cards on the Home dashboard with a
   compact horizontal analytics chart. Data/logic unchanged.
   ============================================================ */
.goal-chart {
  position: relative;
  background: var(--bg-surface);
  border: 1px solid var(--ui-line);
  border-radius: var(--ui-radius);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--ui-shadow-card);
  overflow: hidden;
}

.goal-chart-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.goal-chart-title {
  min-width: 0;
}

.goal-chart-title strong {
  display: block;
  font-size: 14px;
  font-weight: 850;
  letter-spacing: -.025em;
}

.goal-chart-title span {
  display: block;
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 10px;
}

.goal-chart-summary {
  flex: 0 0 auto;
  min-width: 58px;
  text-align: right;
}

.goal-chart-summary b {
  display: block;
  color: var(--brand-primary);
  font-size: 21px;
  line-height: 1;
  font-weight: 850;
  letter-spacing: -.04em;
}

.goal-chart-summary span {
  display: block;
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 700;
}

.goal-chart-body {
  position: relative;
  padding: 0 0 22px;
}

.goal-chart-grid {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 22px;
  pointer-events: none;
  background-image: repeating-linear-gradient(
    to right,
    transparent 0,
    transparent calc(25% - 1px),
    var(--ui-line) calc(25% - 1px),
    var(--ui-line) 25%
  );
  opacity: .7;
}

.goal-chart-row {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(110px, 2fr) 42px;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  padding: 7px 0;
  cursor: pointer;
  border-radius: 10px;
  transition: background .15s, transform .15s;
}

.goal-chart-row:hover {
  background: color-mix(in srgb, var(--brand-primary) 5%, transparent);
}

.goal-chart-row:active {
  transform: scale(.995);
}

.goal-chart-label {
  min-width: 0;
}

.goal-chart-label strong {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-primary);
  font-size: 11px;
  font-weight: 750;
  line-height: 1.25;
}

.goal-chart-label span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 650;
}

.goal-chart-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--brand-accent);
  flex: 0 0 auto;
}

.goal-chart-track {
  position: relative;
  height: 12px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--bg-muted);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ui-line) 80%, transparent);
}

.goal-chart-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  border-radius: inherit;
  background: linear-gradient(
    90deg,
    var(--brand-primary),
    color-mix(in srgb, var(--brand-primary) 68%, var(--brand-accent))
  );
  box-shadow: 0 3px 10px color-mix(in srgb, var(--brand-primary) 20%, transparent);
  transition: width .45s cubic-bezier(.22,1,.36,1);
}

.goal-chart-value {
  text-align: right;
  color: var(--text-primary);
  font-size: 11px;
  font-weight: 850;
  font-variant-numeric: tabular-nums;
}

.goal-chart-axis {
  position: absolute;
  left: 0;
  right: 42px;
  bottom: 0;
  display: flex;
  justify-content: space-between;
  color: var(--text-muted);
  font-size: 8px;
  font-weight: 700;
  pointer-events: none;
}

.goal-chart-axis span {
  transform: translateX(-50%);
}

.goal-chart-axis span:first-child {
  transform: translateX(0);
}

.goal-chart-axis span:last-child {
  transform: translateX(100%);
}

.goal-chart-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px solid var(--ui-line);
}

.goal-chart-legend {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 650;
}

.goal-chart-legend i {
  display: block;
  width: 18px;
  height: 4px;
  border-radius: 999px;
  background: var(--brand-primary);
}

.goal-chart-more {
  font-size: 10px;
  font-weight: 750;
  color: var(--brand-primary);
}

@media (max-width: 420px) {
  .goal-chart {
    padding: 14px;
    border-radius: 14px;
  }

  .goal-chart-row {
    grid-template-columns: minmax(0, 1.15fr) minmax(92px, 1.6fr) 36px;
    gap: 8px;
  }

  .goal-chart-label strong {
    font-size: 10px;
  }

  .goal-chart-track {
    height: 10px;
  }
}

@media (min-width: 700px) {
  .app-main { padding-left: 24px; padding-right: 24px; }
  .app-nav { left:50%; right:auto; width:min(620px,calc(100% - 32px)); transform:translateX(-50%); }
}
@media (max-width: 420px) {
  .app-main { padding: 14px 12px calc(var(--nav-height) + var(--safe-bottom) + 26px); }
  .hero { padding:18px !important; border-radius:19px !important; }
  .hero h1 { font-size:20px !important; }
  .card { padding:13px; border-radius:14px; }
}

/* ============================================================

   ============================================================ */
"use strict";

/* ============================================================
   1. LOCAL DATABASE
   ============================================================ */
const DB = (() => {
  const NS = "corevia.db.";
  const table = (name) => NS + name;
  const IDB_NAME = "corevia_offline_v1";
  const IDB_STORE = "tables";
  let idb = null;
  let sqlite = null;
  let sqliteReady = false;

  let idbReadyResolve;
  const idbReady = new Promise(res => { idbReadyResolve = res; });
  try {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => { idb = req.result; hydrateFromIndexedDB(); idbReadyResolve(true); };
    req.onerror = () => idbReadyResolve(false);
    req.onblocked = () => idbReadyResolve(false);
  } catch (e) { idbReadyResolve(false); }
  setTimeout(() => idbReadyResolve(false), 4000);

  function read(name) {
    try { const raw = localStorage.getItem(table(name)); return raw ? JSON.parse(raw) : []; }
    catch (e) { return []; }
  }
  function write(name, rows) {
    const json = JSON.stringify(rows);
    try { localStorage.setItem(table(name), json); } catch (e) {}
    try { if (idb) idb.transaction(IDB_STORE, "readwrite").objectStore(IDB_STORE).put(rows, name); } catch (e) {}
    if (sqliteReady && sqlite) {
      sqlite.execute({ statements: `INSERT OR REPLACE INTO corevia_kv (name,data) VALUES ('${String(name).replace(/'/g,"''")}','${json.replace(/'/g,"''")}');` }).catch(()=>{});
    }
  }
  function nextId(prefix) {
    return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function hydrateFromIndexedDB() {
    if (!idb) return;
    const tx = idb.transaction(IDB_STORE, "readonly");
    const req = tx.objectStore(IDB_STORE).getAllKeys();
    req.onsuccess = () => {
      (req.result || []).forEach(name => {
        if (localStorage.getItem(table(name)) !== null) return;
        const r = idb.transaction(IDB_STORE, "readonly").objectStore(IDB_STORE).get(name);
        r.onsuccess = () => { if (Array.isArray(r.result)) localStorage.setItem(table(name), JSON.stringify(r.result)); };
      });
    };
  }
  async function putBlob(id, blob) {
    await idbReady;
    if (!idb) return false;
    let payload = blob;
    try { payload = { buf: await blob.arrayBuffer(), type: blob.type || "application/pdf" }; } catch (e) {}
    return new Promise(resolve => {
      try { const tx=idb.transaction(IDB_STORE,"readwrite"); tx.objectStore(IDB_STORE).put(payload,"file:"+id); tx.oncomplete=()=>resolve(true); tx.onerror=()=>resolve(false); }
      catch(e){resolve(false);}
    });
  }
  async function getBlob(id) {
    await idbReady;
    if (!idb) return null;
    return new Promise(resolve => {
      try { const r=idb.transaction(IDB_STORE,"readonly").objectStore(IDB_STORE).get("file:"+id); r.onsuccess=()=>{ const v=r.result; if(!v) return resolve(null); if(v.buf) return resolve(new Blob([v.buf],{type:v.type||"application/pdf"})); resolve(v); }; r.onerror=()=>resolve(null); }
      catch(e){resolve(null);}
    });
  }
  async function deleteBlob(id) {
    await idbReady;
    if (!idb) return;
    try { idb.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).delete("file:"+id); } catch(e) {}
  }
  async function initSQLite() {
    try {
      if (!window.Capacitor || !window.Capacitor.Plugins || !window.Capacitor.Plugins.CapacitorSQLite) return false;
      const plugin = window.Capacitor.Plugins.CapacitorSQLite;
      await plugin.createConnection({database:"corevia",version:1,encrypted:false,mode:"no-encryption",readonly:false});
      await plugin.open({database:"corevia"});
      sqlite = plugin;
      await plugin.execute({database:"corevia",statements:"CREATE TABLE IF NOT EXISTS corevia_kv (name TEXT PRIMARY KEY NOT NULL, data TEXT NOT NULL);"});
      const q = await plugin.query({database:"corevia",statement:"SELECT name,data FROM corevia_kv"});
      (q.values || []).forEach(row => { if (localStorage.getItem(table(row.name)) === null) { try { localStorage.setItem(table(row.name), row.data); } catch(e){} } });
      sqliteReady = true;
      return true;
    } catch(e) { sqliteReady=false; return false; }
  }
  return { read, write, nextId, putBlob, getBlob, deleteBlob, initSQLite };
})();

/* ============================================================
   2. REPOSITORIES
   ============================================================ */
function makeRepo(tableName, idPrefix) {
  return {
    all() { return DB.read(tableName); },
    find(id) { return DB.read(tableName).find(r => r.id === id) || null; },
    where(pred) { return DB.read(tableName).filter(pred); },
    create(data) {
      const rows = DB.read(tableName);
      const now = new Date().toISOString();
      const row = Object.assign(
        { id: DB.nextId(idPrefix), created_at: now, updated_at: now },
        data
      );
      rows.push(row);
      DB.write(tableName, rows);
      return row;
    },
    update(id, patch) {
      const rows = DB.read(tableName);
      const i = rows.findIndex(r => r.id === id);
      if (i < 0) return null;
      rows[i] = Object.assign({}, rows[i], patch, { updated_at: new Date().toISOString() });
      DB.write(tableName, rows);
      return rows[i];
    },
    remove(id) {
      const rows = DB.read(tableName).filter(r => r.id !== id);
      DB.write(tableName, rows);
      return true;
    },
    replaceAll(rows) { DB.write(tableName, rows); },
    count() { return DB.read(tableName).length; }
  };
}

const Session = {
  _key: "corevia.session",
  get() {
    try { return JSON.parse(localStorage.getItem(this._key)); } catch (e) { return null; }
  },
  set(session) { localStorage.setItem(this._key, JSON.stringify(session)); },
  clear() { localStorage.removeItem(this._key); },
  isAuthenticated() { return !!this.get(); },
  can(permission) {
    const s = this.get();
    if (!s) return false;
    if (s.role === "Super Admin") return true;
    return Array.isArray(s.permissions) && s.permissions.includes(permission);
  },
  require(permission) {
    if (!this.can(permission)) {
      throw new Error("Permission denied: " + permission);
    }
  }
};

    remove(id) { Session.require("delete"); return Repos.users.remove(id); },
    count() { return Repos.users.count(); }
  },

  Leader: {
    all() {
      const leaders = [];
      Repos.departments.all().forEach(d => { if (d.manager_id) leaders.push({ user_id: d.manager_id, scope: "Department", scope_name: d.name }); });
      Repos.units.all().forEach(u => { if (u.leader_id) leaders.push({ user_id: u.leader_id, scope: "Unit", scope_name: u.name }); });
      Repos.teams.all().forEach(t => { if (t.leader_id) leaders.push({ user_id: t.leader_id, scope: "Team", scope_name: t.name }); });
      return leaders;
    }
  },

  Goal: {
    list() { return Repos.goals.all(); },
    get(id) { return Repos.goals.find(id); },
    byEntity(type, id) { return Repos.goals.where(g => g.entity_type === type && g.entity_id === id); },
    create(data) { Session.require("manage_goals"); return Repos.goals.create(data); },
    update(id, patch) { Session.require("edit"); return Repos.goals.update(id, patch); },
    remove(id) { Session.require("delete"); return Repos.goals.remove(id); },
    count() { return Repos.goals.count(); },
    activeCount() { return Repos.goals.where(g => g.status === "In Progress" || g.status === "At Risk" || g.status === "in_progress" || g.status === "at_risk").length; }
  },

  Responsibility: {
    byEntity(type, id) { return Repos.responsibilities.where(r => r.entity_type === type && r.entity_id === id); },
    create(data) { Session.require("edit"); return Repos.responsibilities.create(data); },
    remove(id) { Session.require("edit"); return Repos.responsibilities.remove(id); }
  },

  Document: {
    list() { return Repos.documents.all(); },
    get(id) { return Repos.documents.find(id); },
    byEntity(type, id) { return Repos.documents.where(d => d.entity_type === type && d.entity_id === id); },
    create(data) { Session.require("upload"); return Repos.documents.create(data); },
    update(id, patch) { Session.require("edit"); return Repos.documents.update(id, patch); },
    remove(id) { Session.require("delete"); return Repos.documents.remove(id); },
    count() { return Repos.documents.count(); },
    recent(limit) { return Repos.documents.all().sort((a,b) => new Date(b.upload_date) - new Date(a.upload_date)).slice(0, limit || 5); }
  },

  Announcement: {
    list() { return Repos.announcements.all(); },
    get(id) { return Repos.announcements.find(id); },
    byEntity(type, id) { return Repos.announcements.where(a => a.entity_type === type && a.entity_id === id); },
    create(data) { Session.require("manage_announcements"); return Repos.announcements.create(data); },
    update(id, patch) { Session.require("edit"); return Repos.announcements.update(id, patch); },
    remove(id) { Session.require("delete"); return Repos.announcements.remove(id); },
    recent(limit) { return Repos.announcements.all().sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, limit || 3); }
  },

  Notification: {
    list() { return Repos.notifications.all().sort((a,b) => new Date(b.date) - new Date(a.date)); },
    unreadCount() { return Repos.notifications.where(n => !n.read).length; },
    markRead(id) { return Repos.notifications.update(id, { read: true }); },
    remove(id) { return Repos.notifications.remove(id); },
    markAllRead() {
      Repos.notifications.all().forEach(n => Repos.notifications.update(n.id, { read: true }));
    },
    create(data) { return Repos.notifications.create(Object.assign({ read: false, date: new Date().toISOString() }, data)); }
  },

  Task: {
    list() { return Repos.tasks.all(); },
    get(id) { return Repos.tasks.find(id); },
    byStatus(status) { return Repos.tasks.where(t => t.status === status); },
    create(data) { Session.require("manage_tasks"); return Repos.tasks.create(Object.assign({ status: "To Do" }, data)); },
    update(id, patch) { Session.require("edit"); return Repos.tasks.update(id, patch); },
    remove(id) { Session.require("delete"); return Repos.tasks.remove(id); },
    count() { return Repos.tasks.count(); },
    pendingCount() { return Repos.tasks.where(t => t.status !== "Completed").length; }
  },

  Approval: {
    list() { return Repos.approvals.all(); },
    get(id) { return Repos.approvals.find(id); },
    create(data) { Session.require("manage_approvals"); return Repos.approvals.create(Object.assign({ status: "created", created_at: new Date().toISOString() }, data)); },
    update(id, patch) { Session.require("manage_approvals"); return Repos.approvals.update(id, patch); },
    remove(id) { Session.require("delete"); return Repos.approvals.remove(id); },
    pendingCount() { return Repos.approvals.where(a => a.status === "submitted" || a.status === "reviewing").length; }
  },

  Activity: {
    list(limit) {
      const rows = Repos.activityLogs.all().sort((a,b) => new Date(b.date) - new Date(a.date));
      return limit ? rows.slice(0, limit) : rows;
    },
    log(action, entity_type, entity_id, description) {
      const s = Session.get();
      return Repos.activityLogs.create({
        user_id: s ? s.userId : null,
        action, entity_type, entity_id, description,
        date: new Date().toISOString()
      });
    }
  },

  Search: {
    query(q) {
      if (!q || q.trim().length < 2) return [];
      const term = q.toLowerCase().trim();
      const results = [];
      const push = (type, label, id, sub) => {
        if (label && label.toLowerCase().includes(term)) {
          results.push({ type, label, id, sub });
        }
      };

      Repos.companies.all().forEach(c => push("Company", c.name, c.id, c.industry));
      Repos.departments.all().forEach(d => push("Department", d.name, d.id, d.purpose));
      Repos.units.all().forEach(u => push("Unit", u.name, u.id, u.description));
      Repos.teams.all().forEach(t => push("Team", t.name, t.id, t.objectives));
      Repos.users.all().forEach(u => push("User", u.full_name, u.id, u.position));
      Repos.goals.all().forEach(g => push("Goal", g.title, g.id, g.status));
      Repos.documents.all().forEach(d => push("Document", d.filename, d.id, d.type));
      Repos.announcements.all().forEach(a => push("Announcement", a.title, a.id, a.priority));
      Repos.tasks.all().forEach(t => push("Task", t.title, t.id, t.status));

      return results.slice(0, 50);
    }
  },

  Reports: {
    summary() {
      return {
        companies: Repos.companies.count(),
        departments: Repos.departments.count(),
        units: Repos.units.count(),
        teams: Repos.teams.count(),
        users: Repos.users.count(),
        goals: Repos.goals.count(),
        documents: Repos.documents.count(),
        tasks: Repos.tasks.count(),
        announcements: Repos.announcements.count(),
        pendingApprovals: Services.Approval.pendingCount()
      };
    }
  },

  Settings: {
    get(key, defaultValue) {
      const s = Repos.settings.where(x => x.key === key);
      return s.length ? s[0].value : (defaultValue !== undefined ? defaultValue : null);
    },
    set(key, value) {
      const s = Repos.settings.where(x => x.key === key);
      if (s.length) return Repos.settings.update(s[0].id, { value });
      return Repos.settings.create({ key, value });
    }
  }
};

const Theme = {
  apply(org) {
    if (!org) return;
    const root = document.documentElement;

    const primary   = org.primary_color   || THEME_DEFAULTS.primary;
    const secondary = org.secondary_color || THEME_DEFAULTS.secondary;
    const accent    = org.accent_color    || THEME_DEFAULTS.accent;
    root.style.setProperty("--brand-primary",   primary);
    root.style.setProperty("--brand-secondary", secondary);
    root.style.setProperty("--brand-accent",    accent);
    root.style.setProperty("--brand-banner",
      "linear-gradient(135deg," + primary + " 0%," + secondary + " 100%)");

    const font = org.font || "";
    if (font) {
      root.style.setProperty("--font-family",
        "'" + font + "', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif");
    } else {
      root.style.setProperty("--font-family",
        "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif");
    }

    const logoEl  = document.getElementById("brandLogo");

/* ============================================================
   9. ROUTER
   ============================================================ */
const Router = {
  routes: {},
  current: "home",
  history: [],
  currentParams: {},

  register(name, renderFn) { this.routes[name] = renderFn; },

  go(name, params, opts) {
    if (!this.routes[name]) { console.warn("Unknown route:", name); return; }
    const isBack = !!(opts && opts.back);
    if (this.current === "company" && name !== "company") {
      // Rudisha mandhari na nembo ya kampuni mama (si "C" ya kawaida)
      const parentOrg = (typeof Services !== "undefined" && Services.Organization) ? Services.Organization.current() : null;
      if (parentOrg) Theme.apply(parentOrg); else Theme.reset();
    }
    if (!isBack && this.current !== name) {
      this.history.push({ name: this.current, params: this.currentParams || {} });
      if (this.history.length > 50) this.history.shift();
    }
    this.current = name;
    this.currentParams = params || {};
    this.render(name, this.currentParams);
    document.querySelectorAll(".nav-item").forEach(el => {
      el.classList.toggle("active", el.dataset.route === name);
    });
    const mainEl = document.getElementById("main");
    if (mainEl) mainEl.scrollTop = 0;
  },

  back() {
    const prev = this.history.pop();
    if (prev) this.go(prev.name, prev.params, { back: true });
    else this.go("home", {}, { back: true });
  },

  render(name, params) {
    const main = document.getElementById("main");
    if (!main) return;
    try {
      const html = this.routes[name](params);
      main.innerHTML = '<div class="view">' + html + '</div>';
      main.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
    } catch (e) {
      console.error(e);
      main.innerHTML = '<div class="view"><div class="empty-state">' +
        '<h3>' + t("error") + '</h3><p>' + U.esc(e.message) + '</p>' +
        '<button class="btn btn-primary" onclick="Router.go(\'' + this.current + '\')">' + t("retry") + '</button>' +
        '</div></div>';
    }
  }
};

/* ============================================================
   10. UTILITIES
   ============================================================ */
const U = {
  esc(str) {
    if (str == null) return "";
    return String(str)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  },
  initials(name) {
    if (!name) return "?";
    return name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase();
  },
  fmtDate(iso) {
    if (!iso) return "—";
    try {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    } catch (e) { return iso; }
  },
  fmtSize(bytes) {
    if (!bytes) return "0 B";
    const units = ["B","KB","MB","GB"];
    let i = 0, n = bytes;
    while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
    return n.toFixed(i === 0 ? 0 : 1) + " " + units[i];
  },
  toast(msg, type) {
    const el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.style.background = type === "error" ? "var(--state-danger)" :
                          type === "success" ? "var(--state-success)" :
                          "var(--text-primary)";
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), 2200);
  },
  debounce(fn, wait) {
    let timer;
    return function() {
      const args = arguments, ctx = this;
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(ctx, args), wait || 250);
    };
  },
  svg(path, opts) {
    const o = opts || {};
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
      (o.sw || 2) + '" stroke-linecap="round" stroke-linejoin="round" style="' +
      (o.style || "") + '">' + path + '</svg>';
  }
};

    function showError(input, err) {
      input.classList.add("error");
      if (err) err.classList.add("show");
    }
    function clearError(input, err) {
      input.classList.remove("error");
      if (err) err.classList.remove("show");
    }

    // Logo preview
    logoInput.addEventListener("change", () => {
      const file = logoInput.files[0];
      if (!file) { logoDataUrl = null; return; }
      if (file.size > 512 * 1024) {
        U.toast(t("logo_too_large"), "error");
        logoInput.value = "";
        logoDataUrl = null;
        return;
      }
      clearError(logoInput, errLogo);
      const reader = new FileReader();
      reader.onload = e => {
        logoDataUrl = e.target.result;
        // Update top preview
        const topPreview = document.getElementById("setupLogoPreview");
        topPreview.innerHTML = '<img src="' + logoDataUrl + '" alt="logo">';
        topPreview.classList.add("has-logo");
        // Update inline preview
        const inlinePreview = document.getElementById("suPreviewLogo");
        inlinePreview.innerHTML = '<img src="' + logoDataUrl + '" alt="logo">';
      };
      reader.onerror = () => {
        U.toast(t("logo_read_error"), "error");
        logoInput.value = "";
        logoDataUrl = null;
      };
      reader.readAsDataURL(file);
    });

    // Submit
    form.addEventListener("submit", e => {
      e.preventDefault();

      const name = nameInput.value.trim();
      const tagline = taglineInput.value.trim();
      const hasLogo = !!logoDataUrl || (logoInput.files && logoInput.files[0]);

      // Validate
      let ok = true;
      if (!name) { showError(nameInput, errName); ok = false; } else { clearError(nameInput, errName); }
      if (!tagline) { showError(taglineInput, errTagline); ok = false; } else { clearError(taglineInput, errTagline); }
      if (!hasLogo) { showError(logoInput, errLogo); ok = false; } else { clearError(logoInput, errLogo); }

      if (!ok) {
        U.toast(t("error"), "error");
        // Scroll to first error
        const firstErr = document.querySelector(".form-input.error");
        if (firstErr) firstErr.scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }

      function finish(logoFinal) {
        try {
          // 1. Create the organization (mother company)
          const org = seedOrganization({
            name: name,
            tagline: tagline,
            logo: logoFinal,
            primary_color:   document.getElementById("suPrimaryHex").value   || "#2563EB",
            secondary_color: document.getElementById("suSecondaryHex").value || "#1E40AF",
            accent_color:    document.getElementById("suAccentHex").value    || "#F59E0B",
            font:            document.getElementById("suFont").value
          });

          // 2. Seed demo content tied to this org
          seedDemoContent(org);

          // 3. Create default session (Super Admin)
          const firstUser = Repos.users.all()[0];
          if (firstUser) {
            Session.set({
              userId: firstUser.id,
              organizationId: org.id,
              role: firstUser.role || "Super Admin",
              permissions: Repos.permissions.all().map(p => p.code)
            });
          }

          // 4. Apply theme + show header/nav again
          Theme.apply(org);

          const header = document.getElementById("appHeader");
          const nav = document.getElementById("nav");
          if (header) header.style.display = "";
          if (nav) nav.style.display = "";

          const main = document.getElementById("main");
          main.style.padding = "";
          main.style.paddingBottom = "";

          // 5. Update UI
          updateI18N();
          updateNotifBadge();

          U.toast(t("setup_done"), "success");
          Router.go("home");
        } catch (err) {
          console.error(err);
          U.toast(err.message || t("error"), "error");
        }
      }

      // If logoDataUrl already exists, use it
      if (logoDataUrl) {
        finish(logoDataUrl);
      } else if (logoInput.files && logoInput.files[0]) {
        const reader = new FileReader();
        reader.onload = ev => finish(ev.target.result);
        reader.onerror = () => { U.toast(t("logo_read_error"), "error"); finish(null); };
        reader.readAsDataURL(logoInput.files[0]);
      } else {
        finish(null);
      }
    });
  }, 0);
}

Router.register("dept-form", (params) => {
  const existing = params && params.id ? Services.Department.get(params.id) : null;
  if (!Session.can("manage_departments")) return permDenied();
  const d = existing || {};
  const companies = Services.Company.active();
  let html = backBtn() + '<div class="section-title">' + (existing ? t("edit") : t("add_department")) + '</div>';
  html += '<div class="card"><form id="deptForm">' +
    fg(t("dept_name"), '<input id="dfName" class="form-input" required value="' + U.esc(d.name||'') + '">') +
    fg(t("company"),   '<select id="dfCompany" class="form-select">' + companies.map(c =>
      '<option value="' + c.id + '"' + (d.company_id===c.id?' selected':'') + '>' + U.esc(c.name) + '</option>'
    ).join('') + '</select>') +
    fg(t("description"), '<textarea id="dfDesc" class="form-textarea">' + U.esc(d.description||'') + '</textarea>') +
    fg(t("purpose"),     '<textarea id="dfPurpose" class="form-textarea">' + U.esc(d.purpose||'') + '</textarea>') +
    fg(t("objectives"),  '<textarea id="dfObj" class="form-textarea">' + U.esc(d.objectives||'') + '</textarea>') +
    fg(t("status"),      '<select id="dfStatus" class="form-select"><option value="active"' + (d.status!=='disabled'?' selected':'') + '>' + t("active") + '</option><option value="disabled"' + (d.status==='disabled'?' selected':'') + '>' + t("disabled") + '</option></select>') +
    '<div class="row" style="gap:8px;margin-top:8px">' +
    '<button class="btn btn-primary" type="submit">' + t("save") + '</button>' +
    '<button class="btn btn-secondary" type="button" onclick="Router.back()">' + t("cancel") + '</button>' +
    (existing ? '<button class="btn btn-danger" type="button" id="dfDelete">' + t("delete") + '</button>' : '') +
    '</div></form></div>';
  setTimeout(() => {
    const form = document.getElementById('deptForm'); if (!form) return;
    form.addEventListener('submit', e => {
      e.preventDefault();
      const data = { name: document.getElementById('dfName').value.trim(),
        company_id: document.getElementById('dfCompany').value,
        description: document.getElementById('dfDesc').value.trim(),
        purpose: document.getElementById('dfPurpose').value.trim(),
        objectives: document.getElementById('dfObj').value.trim(),
        status: document.getElementById('dfStatus').value };
      try {
        if (existing) Services.Department.update(existing.id, data);
        else Services.Department.create(data);
        Services.Activity.log(existing?'updated':'created','department',existing?existing.id:'', (existing?t('edit'):t('add_department'))+': '+data.name);
        U.toast(existing ? t("saved") : t("created")); Router.back();
      } catch(err) { U.toast(err.message,'error'); }
    });
    if (existing) document.getElementById('dfDelete').onclick = () => {
      if (window.confirm(t("confirm_delete"))) {
        try { Services.Department.remove(existing.id); Services.Activity.log('deleted','department',existing.id,t('delete')+': '+existing.name); U.toast(t("deleted")); Router.go('companies'); }
        catch(e) { U.toast(e.message,'error'); }
      }
    };
  }, 0);
  return html;
});

        this.classList.add("active");

function teamTab(tabId,tm,leader,members,goals,docs,resp,anns,acts){
  if(tabId==="overview") return '<div class="card">'+(tm.responsibilities?'<p class="text-sm">'+U.esc(tm.responsibilities)+'</p>':'<p class="text-sm muted">—</p>')+'</div>';
  if(tabId==="goals"){
    if(!goals.length) return emptyBlock(t("empty_goals"));
    return goals.map(g=>'<div class="card"><div class="row-between"><b>'+U.esc(g.title)+'</b><span class="badge-pill '+goalStatusClass(g.status)+'">'+U.esc(g.status)+'</span></div><div class="progress"><i style="width:'+(g.progress||0)+'%"></i></div></div>').join('');
  }
  if(tabId==="responsibilities"){
    if(!resp.length) return emptyBlock(t("responsibilities"));
    return resp.map(r=>'<div class="card"><p class="text-sm">'+U.esc(r.text)+'</p></div>').join('');
  }
  if(tabId==="leadership"){
    if(!leader) return emptyBlock(t("leaders"));
    return '<div class="list-item" onclick="Router.go(\'user-profile\',{id:\''+leader.id+'\'})"><div class="avatar">'+U.initials(leader.full_name)+'</div><div class="meta"><div class="title">'+U.esc(leader.full_name)+'</div><div class="sub">'+U.esc(leader.position||t("team_leader"))+'</div></div><div class="chev">'+U.svg(Icons.chev)+'</div></div>';
  }
  if(tabId==="members"){
    if(!members.length) return emptyBlock(t("members"));
    return members.map(m=>'<div class="list-item" onclick="Router.go(\'user-profile\',{id:\''+m.id+'\'})"><div class="avatar">'+U.initials(m.full_name)+'</div><div class="meta"><div class="title">'+U.esc(m.full_name)+'</div><div class="sub">'+U.esc(m.position||'')+'</div></div><div class="chev">'+U.svg(Icons.chev)+'</div></div>').join('');
  }
  if(tabId==="documents"){
    if(!docs.length) return emptyBlock(t("empty_documents"));
    return docs.map(d=>'<div class="list-item" onclick="openPdf(\''+d.id+'\')"><div class="avatar">'+U.svg(Icons.doc,{sw:1.8})+'</div><div class="meta"><div class="title">'+U.esc(d.filename)+'</div><div class="sub">'+U.fmtSize(d.size)+'</div></div><div class="chev">'+U.svg(Icons.chev)+'</div></div>').join('');
  }
  if(tabId==="announcements"){
    if(!anns.length) return emptyBlock(t("empty_announcements"));
    return anns.map(a=>'<div class="card"><div class="row-between"><b>'+U.esc(a.title)+'</b><span class="badge-pill '+(a.priority==='important'?'danger':'info')+'">'+U.esc(a.priority)+'</span></div><p class="text-sm muted mt-2">'+U.esc(a.content)+'</p></div>').join('');
  }
  if(tabId==="activity"){
    if(!acts.length) return emptyBlock(t("activity"));
    return acts.map(a=>'<div class="card"><div class="text-sm">'+U.esc(a.description)+'</div><div class="text-xs muted mt-2">'+U.fmtDate(a.date)+'</div></div>').join('');
  }
  return '';
}

let pdfState = { doc: null, zoom: 1, page: 1, url: null, pdf: null };

function openPdf(docId) {
  const d = Services.Document.get(docId);
  if (!d) { U.toast(t("no_data"), "error"); return; }
  pdfState.doc = d; pdfState.zoom = 1; pdfState.page = 1;
  document.getElementById("pdfTitle").textContent = d.filename;
  // pdfMeta iko ndani ya pdfBody na hufutwa PDF ikifungwa — usiitegemee kuwepo
  const metaEl = document.getElementById("pdfMeta");
  if (metaEl) metaEl.textContent = U.fmtSize(d.size) + " • " + (d.type || "application/pdf");
  const delBtn = document.getElementById("pdfDelete");
  if (delBtn) delBtn.style.display = Session.can("delete") ? "" : "none";
  document.getElementById("pdfViewer").classList.add("open");
  renderPdfDocument(d);
  Services.Activity.log("viewed", "document", d.id, t("viewed_doc") + " " + d.filename);
}

function pdfPageLabel(n, total) {
  return t("page_label") + " " + n + " / " + total;
}
function setPdfControls(mode) {
  // mode: "canvas" = zoom + kurasa vinafanya kazi; "basic" = hakuna udhibiti wa ndani
  const show = mode === "canvas";
  ["pdfZoomIn", "pdfZoomOut", "pdfPager"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = show ? "" : "none";
  });
}

// Hakikisha pdf.js imepakiwa (inasubiri kidogo, kisha inajaribu kuipakia yenyewe)
async function ensurePdfJs() {
  for (let i = 0; i < 20 && !window.pdfjsLib; i++) await new Promise(r => setTimeout(r, 150));
  if (window.pdfjsLib) return window.pdfjsLib;
  await new Promise(res => {
    const sc = document.createElement("script");
    sc.src = new URL("libs/pdf.min.js", document.baseURI).href;
    sc.onload = () => res(); sc.onerror = () => res();
    document.head.appendChild(sc);
  });
  return window.pdfjsLib || null;
}

async function renderPdfDocument(d) {
  const body = document.getElementById("pdfBody");
  setPdfControls("basic");
  body.innerHTML = '<div class="pdf-placeholder">' + U.esc(t("loading_pdf")) + '</div>';
  let blob = await DB.getBlob(d.id);
  if (!blob && d.native_path && window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
    try {
      const fs = window.Capacitor.Plugins.Filesystem;
      let r;
      try { r = await fs.readFile({ path: 'corevia/documents/' + d.id + '.pdf', directory: 'DATA' }); }
      catch (e1) { r = await fs.readFile({ path: d.native_path }); }
      const bin = atob(r.data);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      blob = new Blob([bytes], { type: 'application/pdf' });
    } catch (e) { console.warn(e); }
  }
  if (!pdfState.doc || pdfState.doc.id !== d.id) return; // kionyeshi kimefungwa au kimebadilishwa
  if (!blob) {
    body.innerHTML = '<div class="pdf-placeholder"><div style="font-size:18px;font-weight:700">' + U.esc(d.filename) + '</div><div class="text-sm muted">' + U.esc(t("pdf_demo_none")) + '</div></div>';
    return;
  }
  const url = URL.createObjectURL(blob);
  pdfState.url = url;
  let lastErr = null;
  const lib = await ensurePdfJs();
  if (lib) {
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        // Worker iko ndani ya app (libs/) — haihitaji mtandao
        if (lib.GlobalWorkerOptions) {
          lib.GlobalWorkerOptions.workerSrc = new URL("libs/pdf.worker.min.js", document.baseURI).href;
        }
        const data = new Uint8Array(await blob.arrayBuffer());
        const pdf = await lib.getDocument({ data }).promise;
        if (!pdfState.doc || pdfState.doc.id !== d.id) return;
        pdfState.pdf = pdf; pdfState.page = 1;
        setPdfControls("canvas");
        await drawPdfPage(1);
        return;
      } catch (e) {
        lastErr = e; console.warn(e); pdfState.pdf = null; setPdfControls("basic");
        await new Promise(r => setTimeout(r, 400));
      }
    }
  } else { lastErr = new Error("pdf.js haijapakiwa (libs/pdf.min.js haipo)"); }
  if (!pdfState.doc || pdfState.doc.id !== d.id) return;
  body.innerHTML = '<div class="pdf-placeholder"><div class="text-sm">' + U.esc(t("pdf_load_failed")) + '</div>' +
    '<div class="text-sm muted" style="margin-top:8px;word-break:break-word">' + U.esc(String((lastErr && lastErr.message) || lastErr || "")) + '</div></div>';
}

async function drawPdfPage(pageNo) {
  if (!pdfState.pdf) return;
  const pdf = pdfState.pdf;
  const page = await pdf.getPage(pageNo);
  if (pdfState.pdf !== pdf) return;
  const body = document.getElementById('pdfBody');
  const base = page.getViewport({ scale: 1 });
  const avail = Math.max(120, (body.clientWidth || base.width) - 32);
  const cssScale = (avail / base.width) * pdfState.zoom;   // inajipanga kwa upana wa skrini
  const dpr = window.devicePixelRatio || 1;                // inakuwa kali kwenye skrini za simu
  const viewport = page.getViewport({ scale: cssScale * dpr });
  const canvas = document.createElement('canvas');
  canvas.width = Math.floor(viewport.width);
  canvas.height = Math.floor(viewport.height);
  canvas.style.width = Math.floor(viewport.width / dpr) + 'px';
  canvas.style.height = Math.floor(viewport.height / dpr) + 'px';
  const ctx = canvas.getContext('2d');
  body.innerHTML = '';
  body.appendChild(canvas);
  await page.render({ canvasContext: ctx, viewport }).promise;
  document.getElementById('pdfPage').textContent = pdfPageLabel(pageNo, pdf.numPages);
}

function closePdf() {
  if (pdfState.url) { try { URL.revokeObjectURL(pdfState.url); } catch(e) {} }
  document.getElementById("pdfViewer").classList.remove("open");
  document.getElementById("pdfBody").innerHTML = "";
  pdfState = { doc: null, zoom: 1, page: 1, url: null, pdf: null };
}

async function deleteDocument(docId) {
  if (!Session.can("delete")) { U.toast(t("permission_denied"), "error"); return; }
  const d = Services.Document.get(docId);
  if (!d) return;
  if (!window.confirm(t("delete_doc_confirm") + "\n" + d.filename)) return;
  try {
    // Funga kionyeshi kama hati hii ndiyo iliyo wazi
    if (pdfState.doc && pdfState.doc.id === docId) closePdf();
    // Futa faili la ndani (IndexedDB)
    try { await DB.deleteBlob(docId); } catch (e) {}
    // Futa faili la APK (Capacitor Filesystem)
    try {
      const fs = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem;
      if (fs) await fs.deleteFile({ path: "corevia/documents/" + docId + ".pdf", directory: "DATA" });
    } catch (e) { /* faili linaweza kutokuwepo (demo) */ }
    Services.Document.remove(docId);
    try { Services.Activity.log("deleted", "document", docId, t("delete") + ": " + d.filename); } catch (e) {}
    U.toast(t("doc_deleted"), "success");
    const list = document.getElementById("docList");
    if (list) list.innerHTML = renderDocList(Services.Document.list());
    else Router.go("documents");
  } catch (err) {
    U.toast(err.message || "Delete failed", "error");
  }
}
window.deleteDocument = deleteDocument;

/* ---------- Kuzuia kunakili maandishi ---------- */
(function protectContent() {
  const isField = el => el && el.closest && el.closest('input, textarea, select, [contenteditable="true"]');
  ["contextmenu", "dragstart"].forEach(ev =>
    document.addEventListener(ev, e => { if (!isField(e.target)) e.preventDefault(); }, true));
  ["copy", "cut"].forEach(ev =>
    document.addEventListener(ev, e => { if (!isField(e.target)) { e.preventDefault(); if (e.clipboardData) e.clipboardData.setData("text/plain", ""); } }, true));
  document.addEventListener("selectstart", e => { if (!isField(e.target)) e.preventDefault(); }, true);
  document.addEventListener("keydown", e => {
    const k = (e.key || "").toLowerCase();
    if ((e.ctrlKey || e.metaKey) && ["c", "x", "a", "s", "p", "u"].includes(k) && !isField(e.target)) e.preventDefault();
    if (k === "printscreen") { try { navigator.clipboard.writeText(""); } catch (x) {} }
  }, true);
  // Ficha PDF wakati programu iko nyuma (mfano kurekodi skrini/app switcher)
  document.addEventListener("visibilitychange", () => {
    const b = document.getElementById("pdfBody");
    if (b) b.style.visibility = document.hidden ? "hidden" : "visible";
  });
})();

async function openDocumentUpload() {
  if (!Session.can('upload')) { U.toast(t('permission_denied'), 'error'); return; }
  openModal(
    '<div class="modal-title">' + t("upload_pdf") + '</div>' +
    '<form id="docUploadForm">' +
    '<div class="form-group"><label class="form-label">' + t("select_file") + '</label>' +
    '<input id="docFile" type="file" accept="application/pdf,.pdf" class="form-input" required></div>' +
    '<button class="btn btn-primary btn-block" type="submit">' + t("save") + '</button>' +
    '</form>'
  );
  setTimeout(() => {
    const form = document.getElementById('docUploadForm');
    if (!form) return;
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const file = document.getElementById('docFile').files[0];
      if (!file) return;
      try {
        const id = DB.nextId('doc');
        await DB.putBlob(id, file);
        let nativePath = null;
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
          try {
            const b64 = await blobToBase64(file);
            const r = await window.Capacitor.Plugins.Filesystem.writeFile({
              path: 'corevia/documents/' + id + '.pdf',
              data: b64.split(',')[1],
              directory: 'DATA',
              recursive: true
            });
            nativePath = r.uri || 'corevia/documents/' + id + '.pdf';
          } catch (err) { console.warn(err); }
        }
        Repos.documents.create({
          id,
          filename: file.name,
          type: 'application/pdf',
          size: file.size,
          entity_type: 'organization',
          entity_id: null,
          upload_date: new Date().toISOString(),
          updated_date: new Date().toISOString(),
          version: '1.0',
          visibility: 'internal',
          native_path: nativePath
        });
        closeModal();
        U.toast(t("saved"), "success");
        Router.go('documents');
      } catch (err) {
        U.toast(err.message || 'Upload failed', 'error');
      }
    });
  }, 0);
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

  if (!pdfState.doc) return;
  if (!Session.can("share")) { U.toast(t("permission_denied"), "error"); return; }
  const d = pdfState.doc;
  let shared = false;
  try {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share && d.native_path) {
      await window.Capacitor.Plugins.Share.share({ title: d.filename, text: 'Shared from Corevia', url: d.native_path });
      shared = true;
    }
  } catch (e) {}
  if (!shared && navigator.share) {
    try { await navigator.share({ title: d.filename, text: 'Shared from Corevia' }); shared = true; } catch (e) {}
  }
  if (!shared) U.toast(t("share_unavailable"));
});

function openModal(html) {
  const overlay = document.getElementById("modal");
  const sheet = document.getElementById("modalSheet");

  overlay.classList.add("open");
}
function closeModal() {
  const overlay = document.getElementById("modal");
  const sheet = document.getElementById("modalSheet");
  overlay.classList.remove("open", "dragging");
  sheet.classList.remove("dragging");
  sheet.style.transform = "";
  overlay.style.opacity = "";
}

/* Drag-to-close: buruta sheet chini ili kufunga */
(function initSheetDrag() {
  const overlay = document.getElementById("modal");
  const sheet = document.getElementById("modalSheet");
  const CLOSE_DISTANCE = 120;   // px
  const CLOSE_VELOCITY = 0.6;   // px/ms
  let startY = 0, lastY = 0, lastT = 0, velocity = 0, dragging = false, pending = false;

  function onStart(e) {
    if (!overlay.classList.contains("open")) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const onHandle = !!e.target.closest(".modal-handle");
    // Kutoka kwenye handle kila wakati; kwingineko ni pale sheet iko juu kabisa (scrollTop = 0)
    if (!onHandle && sheet.scrollTop > 0) return;
    if (e.target.closest("input, textarea, select")) return;
    startY = lastY = y; lastT = Date.now(); velocity = 0;
    pending = true; dragging = onHandle;
    if (dragging) beginDrag();
  }
  function beginDrag() {
    dragging = true;
    sheet.classList.add("dragging");
    overlay.classList.add("dragging");
  }
  function onMove(e) {
    if (!pending) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const dy = y - startY;
    if (!dragging) {
      if (dy > 8 && sheet.scrollTop <= 0) beginDrag();
      else if (dy < -8) { pending = false; return; }
      else return;
    }
    if (e.cancelable) e.preventDefault();
    const now = Date.now();
    velocity = (y - lastY) / Math.max(1, now - lastT);
    lastY = y; lastT = now;
    const offset = Math.max(0, dy);
    sheet.style.transform = "translateY(" + offset + "px)";
    overlay.style.opacity = String(Math.max(0.2, 1 - offset / (sheet.offsetHeight || 400)));
  }
  function onEnd() {
    if (!pending) return;
    pending = false;
    if (!dragging) return;
    dragging = false;
    const m = /translateY\(([\d.]+)px\)/.exec(sheet.style.transform);
    const offset = m ? parseFloat(m[1]) : 0;
    sheet.classList.remove("dragging");
    overlay.classList.remove("dragging");
    if (offset > CLOSE_DISTANCE || velocity > CLOSE_VELOCITY) {
      sheet.style.transform = "translateY(100%)";
      overlay.style.opacity = "0";
      setTimeout(closeModal, 220);
    } else {
      sheet.style.transform = "";   // rudi juu
      overlay.style.opacity = "";
    }
  }

  sheet.addEventListener("touchstart", onStart, { passive: true });
  sheet.addEventListener("touchmove", onMove, { passive: false });
  sheet.addEventListener("touchend", onEnd);
  sheet.addEventListener("touchcancel", onEnd);
  // Mouse (desktop) kupitia handle
  sheet.addEventListener("mousedown", (e) => {
    if (!e.target.closest(".modal-handle")) return;
    onStart(e);
    const mm = (ev) => onMove(ev);
    const mu = () => { onEnd(); window.removeEventListener("mousemove", mm); window.removeEventListener("mouseup", mu); };
    window.addEventListener("mousemove", mm);
    window.addEventListener("mouseup", mu);
  });
})();
document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target.id === "modal") closeModal();
});

/* Telezesha kushoto au kulia kufuta arifa */
(function initSwipeDelete() {
  let st = null, justSwiped = false;
  function reset(el) {
    el.style.transition = "transform .2s ease, opacity .2s ease";
    el.style.transform = ""; el.style.opacity = "";
  }
  document.addEventListener("pointerdown", (e) => {
    const el = e.target.closest && e.target.closest(".swipe-card[data-nid]");
    if (!el || e.target.closest("button, a, input")) return;
    st = { el, id: el.dataset.nid, x: e.clientX, y: e.clientY, dx: 0, active: false, pid: e.pointerId };
    el.style.transition = "none";
  });
  document.addEventListener("pointermove", (e) => {
    if (!st || e.pointerId !== st.pid) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.active) {
      if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { reset(st.el); st = null; return; }
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
        st.active = true;
        try { st.el.setPointerCapture(e.pointerId); } catch (_) {}
      } else return;
    }
    st.dx = dx;
    const w = st.el.offsetWidth || 300;
    st.el.style.transform = "translateX(" + dx + "px)";
    st.el.style.opacity = String(Math.max(0.25, 1 - Math.abs(dx) / w));
  });
  function finish(e, cancelled) {
    if (!st || e.pointerId !== st.pid) return;
    const { el, id, dx, active } = st; st = null;
    if (!active) { reset(el); return; }
    justSwiped = true; setTimeout(() => { justSwiped = false; }, 350);
    const w = el.offsetWidth || 300;
    if (cancelled || Math.abs(dx) < Math.max(90, w * 0.35)) { reset(el); return; }
    el.style.transition = "transform .2s ease, opacity .2s ease";
    el.style.transform = "translateX(" + (dx > 0 ? w : -w) + "px)";
    el.style.opacity = "0";
    setTimeout(() => {
      try { Services.Notification.remove(id); } catch (err) {}
      const inModal = !!el.closest("#modalSheet");
      el.remove();
      updateNotifBadge();
      U.toast(t("deleted"), "success");
      if (!document.querySelector(".swipe-card[data-nid]")) {
        if (inModal) openModal('<div class="modal-title">' + t("notifications") + '</div><div class="empty-state"><h3>' + t("empty_notifications") + '</h3></div>');
        else Router.go("notifications");
      }
    }, 200);
  }
  document.addEventListener("pointerup", (e) => finish(e, false));
  document.addEventListener("pointercancel", (e) => finish(e, true));
  // Zuia click isiyotakikana mara baada ya kutelezesha
  document.addEventListener("click", (e) => { if (justSwiped) { e.stopPropagation(); e.preventDefault(); } }, true);
})();

/* ============================================================
   23. CAPACITOR INTEGRATION
   ============================================================ */
async function enterFullscreen() {
  // APK (Capacitor): ficha status bar na acha maudhui yaingie chini yake
  if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
    try {
      const { StatusBar } = window.Capacitor.Plugins;
      if (StatusBar) {
        try { await StatusBar.setOverlaysWebView({ overlay: true }); } catch (e) {}
        try { await StatusBar.setBackgroundColor({ color: "#00000000" }); } catch (e) {}
        try { await StatusBar.hide(); } catch (e) {}
      }
    } catch (e) {}
    return;
  }
  // Kivinjari/PWA: Fullscreen API (inahitaji mguso wa mtumiaji)
  const root = document.documentElement;
  const req = root.requestFullscreen || root.webkitRequestFullscreen;
  if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
    try { await req.call(root, { navigationUI: "hide" }); } catch (e) {}
  }
}

async function initCapacitor() {
  if (!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) {
    document.addEventListener("click", enterFullscreen, { once: true });
    return;
  }
  await enterFullscreen();
  try {
    const { SplashScreen } = window.Capacitor.Plugins;
    if (SplashScreen) await SplashScreen.hide();
  } catch (e) {}
  try {
    const { App } = window.Capacitor.Plugins;
    if (App && App.addListener) App.addListener("appStateChange", st => { if (st.isActive) enterFullscreen(); });
  } catch (e) {}
}

/* ============================================================
   24. BOOTSTRAP
   ============================================================ */
async function bootstrap() {
  await DB.initSQLite();

  const savedTheme = Services.Settings.get("theme");
  if (savedTheme) Theme.setMode(savedTheme);
  Palette.apply(Services.Settings.get("palette", "default"));
  const savedLang = Services.Settings.get("language");
  if (savedLang && I18N[savedLang]) currentLang = savedLang;

  const org = Services.Organization.current();

  if (!org) {
    renderSetupScreen();
    initCapacitor();
    return;
  }

  Theme.apply(org);

  if (!Session.isAuthenticated()) {
    const firstUser = Repos.users.all()[0];
    if (firstUser) {
      Session.set({
        userId: firstUser.id,
        organizationId: org.id,
        role: firstUser.role || "Super Admin",
        permissions: Repos.permissions.all().map(p => p.code)
      });
    }
  }

  updateI18N();
  updateNotifBadge();

  Router.go("home");

  initCapacitor();

  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if (Theme.currentMode() === "system") Theme.setMode("system");
  });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootstrap);
} else {
  bootstrap();
}
